# Generated by scripts/service_packages.py; edit the generator.
[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "lfx-acedatacloud-seedance"
version = "0.1.3"
description = "Seedance by Ace Data Cloud: generation and same-task retrieval for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Ace Data Cloud", email = "dev@acedata.cloud"}]
keywords = ["langflow", "lfx", "seedance", "acedatacloud"]
dependencies = ["lfx>=1.12.5,<2", "httpx>=0.24,<1"]

[project.urls]
Homepage = "https://platform.acedata.cloud"
Documentation = "https://github.com/AceDataCloud/LangflowAceDataCloud/blob/main/guides/seedance.md"
Repository = "https://github.com/AceDataCloud/LangflowAceDataCloud"

[project.entry-points."langflow.extensions"]
lfx-acedatacloud-seedance = "lfx_acedatacloud_seedance"

[tool.hatch.service]
key = "seedance"
module = "lfx_acedatacloud_seedance"
bundle = "ace_seedance"
display = "Seedance by Ace Data Cloud"
icon = "Clapperboard"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["*"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/LICENSE", "/hatch_build.py", "/src"]
