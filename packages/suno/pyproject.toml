# Generated by scripts/service_packages.py; edit the generator.
[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "lfx-acedatacloud-suno"
version = "0.1.4"
description = "Suno by Ace Data Cloud: generation and same-task retrieval for Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Ace Data Cloud", email = "dev@acedata.cloud"}]
keywords = ["langflow", "lfx", "suno", "acedatacloud"]
dependencies = ["lfx>=1.12.5,<2", "httpx>=0.24,<1"]

[project.urls]
Homepage = "https://platform.acedata.cloud?utm_source=opensource&utm_medium=referral&utm_campaign=evergreen&utm_content=langflow_suno_package_homepage"
Documentation = "https://github.com/AceDataCloud/LangflowAceDataCloud/blob/v0.1.4/guides/suno.md"
Repository = "https://github.com/AceDataCloud/LangflowAceDataCloud"

[project.entry-points."langflow.extensions"]
lfx-acedatacloud-suno = "lfx_acedatacloud_suno"

[tool.hatch.service]
key = "suno"
module = "lfx_acedatacloud_suno"
bundle = "ace_suno"
display = "Suno by Ace Data Cloud"
icon = "Music"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
exclude = ["*"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/LICENSE", "/hatch_build.py", "/src"]
