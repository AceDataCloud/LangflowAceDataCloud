name: Public release install

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install the public wheel with stable Langflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/AceDataCloud/LangflowAceDataCloud/releases/latest > "$RUNNER_TEMP/release.json"
          wheel_url=$(jq -er '[.assets[] | select(.name | test("^lfx_acedatacloud-[0-9]+\\.[0-9]+\\.[0-9]+-py3-none-any\\.whl$")) | .browser_download_url] | if length == 1 then .[0] else error("Expected exactly one wheel") end' "$RUNNER_TEMP/release.json")
          case "$wheel_url" in
            https://github.com/AceDataCloud/LangflowAceDataCloud/releases/download/*) ;;
            *) echo "Unexpected public release origin"; exit 1 ;;
          esac
          uv venv "$RUNNER_TEMP/public-venv"
          uv pip install --python "$RUNNER_TEMP/public-venv/bin/python" "langflow==1.12.5" "$wheel_url"
      - name: Discover and validate the installed extension
        run: |
          "$RUNNER_TEMP/public-venv/bin/lfx" extension list
          package_root=$("$RUNNER_TEMP/public-venv/bin/python" -c 'from pathlib import Path; import lfx_acedatacloud; print(Path(lfx_acedatacloud.__file__).parent)')
          "$RUNNER_TEMP/public-venv/bin/lfx" extension validate "$package_root" --execute-imports
      - name: Check every component form and parse the no-key flows
        env:
          DO_NOT_TRACK: "1"
          LANGFLOW_CONFIG_DIR: ${{ runner.temp }}/langflow-public-install
        run: |
          "$RUNNER_TEMP/public-venv/bin/python" scripts/check_public_release.py --release "$RUNNER_TEMP/release.json" --output "$RUNNER_TEMP/public-release-readback.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-release-readback
          path: ${{ runner.temp }}/public-release-readback.json
          if-no-files-found: error
